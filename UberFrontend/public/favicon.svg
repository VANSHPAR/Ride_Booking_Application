<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark rounded squircle background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#1f2937" stroke-width="1.5" />

  <!-- Flowing Dynamic Waves (Flowride Crest) -->
  <g filter="url(#glow)">
    <!-- Back Wave -->
    <path 
      d="M12 36 C18 28, 24 28, 30 35 C36 42, 44 42, 52 33 C46 44, 37 45, 30 40 C23 35, 17 38, 12 43 Z" 
      fill="url(#flowGrad)" 
      opacity="0.45" 
    />
    <!-- Front Dynamic Wave -->
    <path 
      d="M12 29 C18 20, 26 21, 32 28 C38 35, 46 34, 52 24 C47 38, 38 40, 31 33 C25 27, 18 29, 12 37 Z" 
      fill="url(#flowGrad)" 
    />
    <!-- Sparkle / Flow pulse dot -->
    <circle cx="49" cy="20" r="3" fill="#06b6d4" />
  </g>
</svg>